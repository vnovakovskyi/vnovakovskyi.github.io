<svg xmlns="http://www.w3.org/2000/svg" width="680" height="502" viewBox="0 0 680 502" role="img">
<title>On-stack replacement of a long-running loop</title>
<desc>A method called once never trips the call counter, but its loop trips the backedge counter. A compiler thread compiles the method while the loop is still running, and on-stack replacement turns the interpreter frame into a compiled frame between two iterations.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4}
.lbl{font-size:12px;fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="140" y="50" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">One call, a million iterations</text><text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">the method is entered once and stays in its loop</text></g>
<line class="arr" x1="340" y1="106" x2="340" y2="128"/>
<path class="arr" d="M340 128 L185 128 L185 140" marker-end="url(#arrow)"/>
<path class="arr" d="M340 128 L495 128 L495 140" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="168" text-anchor="middle" dominant-baseline="central">Call counter</text><text class="ts" x="185" y="186" text-anchor="middle" dominant-baseline="central">stuck at 1, never trips</text></g>
<g class="c-purple"><rect x="370" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="168" text-anchor="middle" dominant-baseline="central">Backedge counter</text><text class="ts" x="495" y="186" text-anchor="middle" dominant-baseline="central">counts iterations, trips</text></g>
<path class="arr" d="M495 206 L495 228 L340 228 L340 240" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="250" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="268" text-anchor="middle" dominant-baseline="central">A compiler thread compiles the method</text><text class="ts" x="340" y="286" text-anchor="middle" dominant-baseline="central">while the loop keeps running in the interpreter</text></g>
<line class="arr" x1="340" y1="316" x2="340" y2="330" marker-end="url(#arrow)"/>
<rect class="dash" x="40" y="340" width="600" height="100" rx="8"/>
<text class="lbl" x="56" y="360" dominant-baseline="central">on-stack replacement, between two iterations</text>
<g class="c-purple"><rect x="60" y="378" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="396" text-anchor="middle" dominant-baseline="central">Interpreter frame</text><text class="ts" x="185" y="414" text-anchor="middle" dominant-baseline="central">in the loop, iteration N</text></g>
<line class="arr" x1="320" y1="406" x2="360" y2="406" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="370" y="378" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="396" text-anchor="middle" dominant-baseline="central">Compiled frame</text><text class="ts" x="495" y="414" text-anchor="middle" dominant-baseline="central">same loop, iteration N + 1</text></g>
<g class="c-purple"><rect x="140" y="470" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="158" y="476" fill="#5F5E5A" dominant-baseline="central">bytecode</text>
<g class="c-teal"><rect x="300" y="470" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="318" y="476" fill="#5F5E5A" dominant-baseline="central">machine code</text>
</svg>
