<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img">
<title>From an image in the registry to a running JVM process</title>
<desc>The image goes into the orchestrator and comes out as a running container; the container runs the java launcher, which loads libjvm and becomes a JVM process.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="50" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="68" text-anchor="middle" dominant-baseline="central">Image</text><text class="ts" x="185" y="86" text-anchor="middle" dominant-baseline="central">pulled from the registry</text></g>
<g class="c-purple"><rect x="370" y="50" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="68" text-anchor="middle" dominant-baseline="central">ECS or Kubernetes</text><text class="ts" x="495" y="86" text-anchor="middle" dominant-baseline="central">starts a container from it</text></g>
<line class="arr" x1="320" y1="78" x2="360" y2="78" marker-end="url(#arrow)"/>
<path class="arr" d="M495 106 L495 128 L185 128 L185 140" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="168" text-anchor="middle" dominant-baseline="central">Container</text><text class="ts" x="185" y="186" text-anchor="middle" dominant-baseline="central">runs java -jar app.jar</text></g>
<g class="c-purple"><rect x="370" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="168" text-anchor="middle" dominant-baseline="central">java (launcher)</text><text class="ts" x="495" y="186" text-anchor="middle" dominant-baseline="central">finds and loads libjvm</text></g>
<line class="arr" x1="320" y1="178" x2="360" y2="178" marker-end="url(#arrow)"/>
<path class="arr" d="M495 206 L495 228 L185 228 L185 240" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="250" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="268" text-anchor="middle" dominant-baseline="central">JVM process</text><text class="ts" x="185" y="286" text-anchor="middle" dominant-baseline="central">threads, heap, your main()</text></g>
<g class="c-gray"><rect x="60" y="340" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="346" fill="#5F5E5A" dominant-baseline="central">artifact</text>
<g class="c-purple"><rect x="190" y="340" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="208" y="346" fill="#5F5E5A" dominant-baseline="central">tool</text>
</svg>
