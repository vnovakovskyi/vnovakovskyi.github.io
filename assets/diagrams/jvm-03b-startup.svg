<svg xmlns="http://www.w3.org/2000/svg" width="680" height="722" viewBox="0 0 680 722" role="img">
<title>The seven steps of JVM startup</title>
<desc>The launcher loads libjvm, ergonomics picks the heap and garbage collector, service threads start, and hundreds of core classes load. Only then does your main class load, link, initialize and run, with every other class loaded lazily afterwards.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="140" y="50" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">1. Launcher starts</text><text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">java loads libjvm, which is HotSpot</text></g>
<line class="arr" x1="340" y1="116" x2="340" y2="132" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="142" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">2. Ergonomics</text><text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">reads limits, picks heap size and GC</text></g>
<line class="arr" x1="340" y1="208" x2="340" y2="224" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="234" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">3. Service threads start</text><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">GC, JIT compilers, signal handler</text></g>
<line class="arr" x1="340" y1="300" x2="340" y2="316" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="326" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="344" text-anchor="middle" dominant-baseline="central">4. Core classes load</text><text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">Object, String, Thread — hundreds of them</text></g>
<line class="arr" x1="340" y1="392" x2="340" y2="408" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="418" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="436" text-anchor="middle" dominant-baseline="central">5. Your main class loads</text><text class="ts" x="340" y="454" text-anchor="middle" dominant-baseline="central">Main-Class from the jar manifest</text></g>
<line class="arr" x1="340" y1="484" x2="340" y2="500" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="510" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="528" text-anchor="middle" dominant-baseline="central">6. Link and initialize</text><text class="ts" x="340" y="546" text-anchor="middle" dominant-baseline="central">verify bytecode, run static blocks</text></g>
<line class="arr" x1="340" y1="576" x2="340" y2="592" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="602" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="620" text-anchor="middle" dominant-baseline="central">7. main() runs</text><text class="ts" x="340" y="638" text-anchor="middle" dominant-baseline="central">every other class loads lazily</text></g>
<g class="c-gray"><rect x="140" y="690" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="158" y="696" fill="#5F5E5A" dominant-baseline="central">the JVM starting itself</text>
<g class="c-purple"><rect x="360" y="690" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="378" y="696" fill="#5F5E5A" dominant-baseline="central">your application</text>
</svg>
