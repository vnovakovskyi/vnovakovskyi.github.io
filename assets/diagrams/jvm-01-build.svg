<svg xmlns="http://www.w3.org/2000/svg" width="680" height="472" viewBox="0 0 680 472" role="img">
<title>From sources to a container image, one artifact at a time</title>
<desc>Sources go into javac and come out as bytecode; bytecode goes into maven package and comes out as app.jar; app.jar goes into docker build and comes out as an image that already carries a runtime.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="50" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="68" text-anchor="middle" dominant-baseline="central">Sources</text><text class="ts" x="185" y="86" text-anchor="middle" dominant-baseline="central">*.java, pom.xml</text></g>
<g class="c-purple"><rect x="370" y="50" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="68" text-anchor="middle" dominant-baseline="central">javac</text><text class="ts" x="495" y="86" text-anchor="middle" dominant-baseline="central">compiles sources to bytecode</text></g>
<line class="arr" x1="320" y1="78" x2="360" y2="78" marker-end="url(#arrow)"/>
<path class="arr" d="M495 106 L495 128 L185 128 L185 140" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="168" text-anchor="middle" dominant-baseline="central">Bytecode</text><text class="ts" x="185" y="186" text-anchor="middle" dominant-baseline="central">*.class files</text></g>
<g class="c-purple"><rect x="370" y="150" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="168" text-anchor="middle" dominant-baseline="central">maven package</text><text class="ts" x="495" y="186" text-anchor="middle" dominant-baseline="central">zips classes (+ libs for a fat jar)</text></g>
<line class="arr" x1="320" y1="178" x2="360" y2="178" marker-end="url(#arrow)"/>
<path class="arr" d="M495 206 L495 228 L185 228 L185 240" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="250" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="268" text-anchor="middle" dominant-baseline="central">app.jar</text><text class="ts" x="185" y="286" text-anchor="middle" dominant-baseline="central">your code + libraries</text></g>
<g class="c-purple"><rect x="370" y="250" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="268" text-anchor="middle" dominant-baseline="central">docker build</text><text class="ts" x="495" y="286" text-anchor="middle" dominant-baseline="central">adds the jar to a base image</text></g>
<line class="arr" x1="320" y1="278" x2="360" y2="278" marker-end="url(#arrow)"/>
<path class="arr" d="M495 306 L495 328 L185 328 L185 340" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="350" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="368" text-anchor="middle" dominant-baseline="central">Image</text><text class="ts" x="185" y="386" text-anchor="middle" dominant-baseline="central">runtime + your app.jar</text></g>
<g class="c-gray"><rect x="60" y="440" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="446" fill="#5F5E5A" dominant-baseline="central">artifact</text>
<g class="c-purple"><rect x="190" y="440" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="208" y="446" fill="#5F5E5A" dominant-baseline="central">tool</text>
</svg>
