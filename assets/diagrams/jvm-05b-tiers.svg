<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img">
<title>Compilation tiers, and the way back down</title>
<desc>A method starts at level 0 in the interpreter, moves to level 3 where C1 compiles it quickly and collects a profile, and then to level 4 where C2 uses that profile. When a speculative guard fails, deoptimization takes execution back to the interpreter.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="240" y="50" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="440" y="68" text-anchor="middle" dominant-baseline="central">Level 0 — interpreter</text><text class="ts" x="440" y="86" text-anchor="middle" dominant-baseline="central">nothing is compiled, the counters tick up</text></g>
<line class="arr" x1="440" y1="116" x2="440" y2="150" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="240" y="160" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="440" y="178" text-anchor="middle" dominant-baseline="central">Level 3 — C1</text><text class="ts" x="440" y="196" text-anchor="middle" dominant-baseline="central">compiles fast, mediocre code, collects a profile</text></g>
<line class="arr" x1="440" y1="226" x2="440" y2="260" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="240" y="270" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="440" y="288" text-anchor="middle" dominant-baseline="central">Level 4 — C2</text><text class="ts" x="440" y="306" text-anchor="middle" dominant-baseline="central">slow to compile, uses the profile, very good code</text></g>
<path class="arr" d="M230 298 L150 298 L150 214"/>
<g class="c-gray"><rect x="75" y="170" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="150" y="184" text-anchor="middle" dominant-baseline="central">Deoptimization</text><text class="ts" x="150" y="202" text-anchor="middle" dominant-baseline="central">a guard failed</text></g>
<path class="arr" d="M150 170 L150 78 L230 78" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="240" y="360" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="258" y="366" fill="#5F5E5A" dominant-baseline="central">bytecode</text>
<g class="c-teal"><rect x="400" y="360" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="418" y="366" fill="#5F5E5A" dominant-baseline="central">machine code</text>
</svg>
