<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" role="img">
<title>Inside the java process</title>
<desc>One OS process holds class loaders, the execution engine and the memory areas: heap, metaspace, thread stacks and the code cache. Machine code runs on the CPU.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4}
.lbl{font-size:12px;fill:#5F5E5A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="dash" x="40" y="50" width="600" height="250" rx="8"/>
<text class="lbl" x="56" y="70" dominant-baseline="central">java process</text>
<g class="c-purple"><rect x="70" y="90" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="108" text-anchor="middle" dominant-baseline="central">Class loaders</text><text class="ts" x="190" y="126" text-anchor="middle" dominant-baseline="central">read *.class from jars</text></g>
<g class="c-purple"><rect x="350" y="90" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="108" text-anchor="middle" dominant-baseline="central">Execution engine</text><text class="ts" x="470" y="126" text-anchor="middle" dominant-baseline="central">interpreter, JIT, GC</text></g>
<line class="arr" x1="320" y1="118" x2="340" y2="118" marker-end="url(#arrow)"/>
<rect class="dash" x="70" y="175" width="520" height="100" rx="8"/>
<text class="lbl" x="86" y="195" dominant-baseline="central">memory areas</text>
<g class="c-gray"><rect x="80" y="215" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="135" y="237" text-anchor="middle" dominant-baseline="central">Heap</text></g>
<g class="c-gray"><rect x="210" y="215" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="265" y="237" text-anchor="middle" dominant-baseline="central">Metaspace</text></g>
<g class="c-gray"><rect x="340" y="215" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="395" y="237" text-anchor="middle" dominant-baseline="central">Stacks</text></g>
<g class="c-gray"><rect x="470" y="215" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="525" y="237" text-anchor="middle" dominant-baseline="central">Code cache</text></g>
<path class="arr" d="M600 118 L620 118 L620 320 L350 320 L350 330" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="240" y="340" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="362" text-anchor="middle" dominant-baseline="central">CPU</text></g>
<g class="c-purple"><rect x="60" y="400" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="406" fill="#5F5E5A" dominant-baseline="central">threads doing work</text>
<g class="c-gray"><rect x="250" y="400" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="268" y="406" fill="#5F5E5A" dominant-baseline="central">memory and hardware</text>
</svg>
