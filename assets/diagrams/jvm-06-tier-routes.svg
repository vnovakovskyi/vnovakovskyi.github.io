<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442" role="img">
<title>The routes a method takes between compilation levels</title>
<desc>The usual path is level 0 to 3 to 4. A trivial method goes straight from 0 to 1. When the C2 queue is long the route is 0 to 2 to 3 to 4, and when the C1 queue is long it is 0 straight to 4. Deoptimization takes a method from level 4 back to level 0.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="50" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="72" text-anchor="middle" dominant-baseline="central">the usual path</text></g>
<g class="c-purple"><rect x="260" y="50" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="290" y="72" text-anchor="middle" dominant-baseline="central">0</text></g>
<line class="arr" x1="330" y1="72" x2="350" y2="72" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="50" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="390" y="72" text-anchor="middle" dominant-baseline="central">3</text></g>
<line class="arr" x1="430" y1="72" x2="450" y2="72" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="460" y="50" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="490" y="72" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-gray"><rect x="40" y="120" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="142" text-anchor="middle" dominant-baseline="central">trivial method</text></g>
<g class="c-purple"><rect x="260" y="120" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="290" y="142" text-anchor="middle" dominant-baseline="central">0</text></g>
<line class="arr" x1="330" y1="142" x2="350" y2="142" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="120" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="390" y="142" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-gray"><rect x="40" y="190" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="212" text-anchor="middle" dominant-baseline="central">C2 queue is long</text></g>
<g class="c-purple"><rect x="260" y="190" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="290" y="212" text-anchor="middle" dominant-baseline="central">0</text></g>
<line class="arr" x1="330" y1="212" x2="350" y2="212" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="190" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="390" y="212" text-anchor="middle" dominant-baseline="central">2</text></g>
<line class="arr" x1="430" y1="212" x2="450" y2="212" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="460" y="190" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="490" y="212" text-anchor="middle" dominant-baseline="central">3</text></g>
<line class="arr" x1="530" y1="212" x2="550" y2="212" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="560" y="190" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="590" y="212" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-gray"><rect x="40" y="260" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="282" text-anchor="middle" dominant-baseline="central">C1 queue is long</text></g>
<g class="c-purple"><rect x="260" y="260" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="290" y="282" text-anchor="middle" dominant-baseline="central">0</text></g>
<line class="arr" x1="330" y1="282" x2="350" y2="282" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="260" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="390" y="282" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-gray"><rect x="40" y="330" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="352" text-anchor="middle" dominant-baseline="central">deoptimization</text></g>
<g class="c-teal"><rect x="260" y="330" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="290" y="352" text-anchor="middle" dominant-baseline="central">4</text></g>
<line class="arr" x1="330" y1="352" x2="350" y2="352" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="360" y="330" width="60" height="44" rx="8" stroke-width="0.5"/><text class="th" x="390" y="352" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-purple"><rect x="40" y="410" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="58" y="416" fill="#5F5E5A" dominant-baseline="central">interpreted</text>
<g class="c-teal"><rect x="200" y="410" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="218" y="416" fill="#5F5E5A" dominant-baseline="central">compiled machine code</text>
</svg>
