<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img">
<title>How the template interpreter executes one bytecode</title>
<desc>The interpreter reads the current opcode from the method bytecode, looks its template address up in the dispatch table, and jumps into that template, which is machine code generated once at VM startup. The template does the work and then dispatches to the next opcode.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4}
.lbl{font-size:12px;fill:#5F5E5A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="dash" x="60" y="50" width="560" height="96" rx="8"/>
<text class="lbl" x="76" y="70" dominant-baseline="central">method bytecode</text>
<g class="c-gray"><rect x="95" y="88" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="152" y="102" text-anchor="middle" dominant-baseline="central">0x1b</text><text class="ts" x="152" y="120" text-anchor="middle" dominant-baseline="central">iload_1</text></g>
<g class="c-gray"><rect x="220" y="88" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="277" y="102" text-anchor="middle" dominant-baseline="central">0x1c</text><text class="ts" x="277" y="120" text-anchor="middle" dominant-baseline="central">iload_2</text></g>
<g class="c-purple"><rect x="345" y="88" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="402" y="102" text-anchor="middle" dominant-baseline="central">0x60</text><text class="ts" x="402" y="120" text-anchor="middle" dominant-baseline="central">iadd</text></g>
<g class="c-gray"><rect x="470" y="88" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="527" y="102" text-anchor="middle" dominant-baseline="central">0x3e</text><text class="ts" x="527" y="120" text-anchor="middle" dominant-baseline="central">istore_3</text></g>
<path class="arr" d="M402 152 L402 168 L270 168 L270 176" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="186" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="204" text-anchor="middle" dominant-baseline="central">Dispatch table</text><text class="ts" x="270" y="222" text-anchor="middle" dominant-baseline="central">opcode → template address</text></g>
<line class="arr" x1="270" y1="252" x2="270" y2="280" marker-end="url(#arrow)"/>
<rect class="dash" x="110" y="290" width="320" height="96" rx="8"/>
<text class="lbl" x="126" y="310" dominant-baseline="central">generated once at VM startup</text>
<g class="c-purple"><rect x="130" y="322" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="340" text-anchor="middle" dominant-baseline="central">Template for 0x60</text><text class="ts" x="270" y="358" text-anchor="middle" dominant-baseline="central">machine code: pop, add, push</text></g>
<path class="arr" d="M420 350 L610 350 L610 170 L527 170 L527 152" marker-end="url(#arrow)"/>
<text class="ts" x="520" y="245" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">dispatch to the</text>
<text class="ts" x="520" y="261" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">next opcode</text>
<g class="c-purple"><rect x="60" y="420" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="426" fill="#5F5E5A" dominant-baseline="central">the opcode being executed right now</text>
</svg>
