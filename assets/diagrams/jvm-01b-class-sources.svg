<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" role="img">
<title>Where the classes a running JVM loads actually come from</title>
<desc>The standard library ships with the runtime, while your own classes and third-party libraries such as Spring, Jackson or a JDBC driver come from your build. A running JVM loads all three.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="50" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="68" text-anchor="middle" dominant-baseline="central">Standard library</text><text class="ts" x="185" y="86" text-anchor="middle" dominant-baseline="central">java.base, java.util, java.io</text></g>
<g class="c-purple"><rect x="60" y="140" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="158" text-anchor="middle" dominant-baseline="central">Your classes</text><text class="ts" x="185" y="176" text-anchor="middle" dominant-baseline="central">compiled from your sources</text></g>
<g class="c-purple"><rect x="60" y="230" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="248" text-anchor="middle" dominant-baseline="central">Third-party libraries</text><text class="ts" x="185" y="266" text-anchor="middle" dominant-baseline="central">Spring, Jackson, JDBC driver</text></g>
<path class="arr" d="M320 78 L340 78 L340 160"/>
<path class="arr" d="M320 258 L340 258 L340 176"/>
<line class="arr" x1="320" y1="168" x2="340" y2="168"/>
<line class="arr" x1="340" y1="168" x2="360" y2="168" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="370" y="140" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="158" text-anchor="middle" dominant-baseline="central">Running JVM</text><text class="ts" x="495" y="176" text-anchor="middle" dominant-baseline="central">class loaders load all three</text></g>
<g class="c-gray"><rect x="60" y="320" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="326" fill="#5F5E5A" dominant-baseline="central">ships with the runtime</text>
<g class="c-purple"><rect x="290" y="320" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="308" y="326" fill="#5F5E5A" dominant-baseline="central">comes from your build</text>
</svg>
