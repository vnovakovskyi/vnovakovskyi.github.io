<svg xmlns="http://www.w3.org/2000/svg" width="680" height="632" viewBox="0 0 680 632" role="img">
<title>What the JIT does to a method that got hot</title>
<desc>While a method is interpreted, two counters tick up. Once one crosses its threshold the method is queued, a background compiler thread turns its bytecode into machine code, the code lands in the code cache, the method entry pointer is updated, and the next call runs on the CPU directly.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="140" y="50" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">The method runs in the interpreter</text><text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">two counters tick up: calls and loop iterations</text></g>
<line class="arr" x1="340" y1="116" x2="340" y2="132" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="142" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">A counter crosses its threshold</text><text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">the method is queued for compilation</text></g>
<line class="arr" x1="340" y1="208" x2="340" y2="224" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="234" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">A compiler thread picks it up</text><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">C1 or C2 compiles in the background, no pause</text></g>
<line class="arr" x1="340" y1="300" x2="340" y2="316" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="326" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="344" text-anchor="middle" dominant-baseline="central">Machine code lands in the code cache</text><text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">executable memory inside the same process</text></g>
<line class="arr" x1="340" y1="392" x2="340" y2="408" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="418" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="436" text-anchor="middle" dominant-baseline="central">The entry pointer is updated</text><text class="ts" x="340" y="454" text-anchor="middle" dominant-baseline="central">the next call jumps straight into that code</text></g>
<line class="arr" x1="340" y1="484" x2="340" y2="500" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="510" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="528" text-anchor="middle" dominant-baseline="central">The CPU executes it directly</text><text class="ts" x="340" y="546" text-anchor="middle" dominant-baseline="central">no JVM and no OS in between</text></g>
<g class="c-purple"><rect x="140" y="600" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="158" y="606" fill="#5F5E5A" dominant-baseline="central">still bytecode</text>
<g class="c-teal"><rect x="360" y="600" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="378" y="606" fill="#5F5E5A" dominant-baseline="central">machine code</text>
</svg>
