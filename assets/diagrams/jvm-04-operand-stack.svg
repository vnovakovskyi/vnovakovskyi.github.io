<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>How four bytecode instructions change the operand stack</title>
<desc>iload_1 pushes 3, iload_2 pushes 4, iadd pops both and pushes 7, istore_3 pops 7 into a local slot and leaves the stack empty.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4}
.lbl{font-size:12px;fill:#5F5E5A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}.c-gray .t{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-purple .t{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="50" width="580" height="56" rx="8" stroke-width="0.5"/><text class="th" x="350" y="68" text-anchor="middle" dominant-baseline="central">Frame locals</text><text class="ts" x="350" y="86" text-anchor="middle" dominant-baseline="central">slot 1 = a = 3, slot 2 = b = 4, slot 3 = c</text></g>
<line class="arr" x1="117" y1="106" x2="117" y2="130" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="140" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="117" y="162" text-anchor="middle" dominant-baseline="central">iload_1</text></g>
<g class="c-purple"><rect x="215" y="140" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="272" y="162" text-anchor="middle" dominant-baseline="central">iload_2</text></g>
<g class="c-purple"><rect x="370" y="140" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="427" y="162" text-anchor="middle" dominant-baseline="central">iadd</text></g>
<g class="c-purple"><rect x="525" y="140" width="115" height="44" rx="8" stroke-width="0.5"/><text class="th" x="582" y="162" text-anchor="middle" dominant-baseline="central">istore_3</text></g>
<rect class="dash" x="60" y="200" width="115" height="100" rx="8"/>
<text class="lbl" x="117" y="214" text-anchor="middle" dominant-baseline="central">operand stack</text>
<g class="c-gray"><rect x="70" y="262" width="95" height="28" rx="4" stroke-width="0.5"/><text class="t" x="117" y="276" text-anchor="middle" dominant-baseline="central">3</text></g>
<rect class="dash" x="215" y="200" width="115" height="100" rx="8"/>
<g class="c-gray"><rect x="225" y="230" width="95" height="28" rx="4" stroke-width="0.5"/><text class="t" x="272" y="244" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-gray"><rect x="225" y="262" width="95" height="28" rx="4" stroke-width="0.5"/><text class="t" x="272" y="276" text-anchor="middle" dominant-baseline="central">3</text></g>
<rect class="dash" x="370" y="200" width="115" height="100" rx="8"/>
<g class="c-gray"><rect x="380" y="262" width="95" height="28" rx="4" stroke-width="0.5"/><text class="t" x="427" y="276" text-anchor="middle" dominant-baseline="central">7</text></g>
<rect class="dash" x="525" y="200" width="115" height="100" rx="8"/>
<text class="lbl" x="582" y="276" text-anchor="middle" dominant-baseline="central">empty</text>
<line class="arr" x1="185" y1="250" x2="205" y2="250" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="250" x2="360" y2="250" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="250" x2="515" y2="250" marker-end="url(#arrow)"/>
</svg>
